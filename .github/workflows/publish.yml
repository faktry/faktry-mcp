name: Publish

# Publishes to npm via trusted publishing (OIDC, no long-lived token), then to the MCP Registry.
# Trigger: push a tag matching package.json, e.g. v0.1.2. Use `npm run release -- patch` to do it all.
#
# Manual run (Actions tab -> Run workflow) skips npm and only publishes server.json to the MCP Registry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, required for trusted publishing
          registry-url: https://registry.npmjs.org

      - name: Check tag, package.json and server.json agree
        run: |
          pkg="$(node -p "require('./package.json').version")"
          server="$(node -p "require('./server.json').version")"
          server_pkg="$(node -p "require('./server.json').packages[0].version")"
          if [ "${GITHUB_REF_NAME}" != "v${pkg}" ] || [ "${pkg}" != "${server}" ] || [ "${pkg}" != "${server_pkg}" ]; then
            echo "Version mismatch: tag=${GITHUB_REF_NAME} package.json=${pkg} server.json=${server} server.json package=${server_pkg}" >&2
            exit 1
          fi

      - run: npm install --omit=dev --ignore-scripts
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public

  registry:
    needs: npm
    if: ${{ always() && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the version to appear on npm
        run: |
          version="$(node -p "require('./server.json').packages[0].version")"
          for i in $(seq 1 30); do
            if npm view "@faktry/mcp@${version}" version >/dev/null 2>&1; then
              echo "@faktry/mcp@${version} is on npm"
              exit 0
            fi
            echo "Waiting for @faktry/mcp@${version} on npm (${i}/30)..."
            sleep 10
          done
          echo "@faktry/mcp@${version} never appeared on npm" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
